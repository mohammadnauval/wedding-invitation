<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left arm coming from top-left with sleeve/cuff -->
  <!-- Arm -->
  <path d="M20 10 L55 45 Q60 50, 65 55 L80 70" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M10 25 L45 60 Q50 65, 58 68" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Square cuff/sleeve -->
  <rect x="55" y="48" width="30" height="25" rx="2" stroke="#c41e3a" stroke-width="4" fill="none"/>
  
  <!-- Left hand - OK gesture holding ring -->
  <!-- Thumb and index making circle (holding ring) -->
  <path d="M85 58 Q95 50, 105 52 Q112 55, 115 62 Q117 68, 114 75 Q110 80, 104 82 Q97 83, 92 78 Q87 73, 85 65" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Middle finger pointing up -->
  <path d="M100 52 Q102 42, 105 34 Q107 28, 110 24" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ring finger -->
  <path d="M106 50 Q110 40, 115 32 Q118 26, 120 22" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Pinky finger -->
  <path d="M112 53 Q118 44, 124 38 Q128 33, 130 30" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- The Ring with bow (held in OK gesture) -->
  <!-- Ring circle -->
  <ellipse cx="100" cy="72" rx="10" ry="11" stroke="#c41e3a" stroke-width="3.5" fill="none"/>
  
  <!-- Bow on ring -->
  <path d="M94 62 Q90 56, 86 54 Q84 53, 82 55" 
        stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M106 62 Q110 56, 114 54 Q116 53, 118 55" 
        stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M94 62 Q100 58, 106 62" 
        stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkle lines from ring -->
  <line x1="118" y1="58" x2="125" y2="53" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="65" x2="130" y2="63" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="126" y2="45" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>

  <!-- Right hand - open palm facing up, from bottom-right -->
  <!-- Arm coming from bottom right -->
  <path d="M220 200 Q215 185, 210 172 Q205 160, 198 150 L190 138" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M240 190 Q232 178, 225 168 Q218 158, 212 148 L205 138" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Right palm - cupped/open -->
  <path d="M190 138 Q185 130, 180 125 Q175 120, 170 118" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M205 138 Q200 128, 195 122 Q190 118, 186 116" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Fingers of right hand (spread, cupped) -->
  <!-- Index -->
  <path d="M170 118 Q165 110, 162 102 Q160 96, 160 90" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Middle -->
  <path d="M175 115 Q172 106, 170 97 Q168 90, 168 84" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ring -->
  <path d="M180 114 Q178 105, 177 97 Q176 90, 177 84" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Pinky -->
  <path d="M186 116 Q185 108, 185 100 Q185 94, 186 88" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Thumb (curving out to left) -->
  <path d="M168 122 Q160 126, 152 128 Q146 130, 140 130 Q136 129, 134 126" 
        stroke="#c41e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
