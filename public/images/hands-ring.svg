<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left hand holding ring (from sleeve) -->
  <!-- Left sleeve -->
  <path d="M30 180 L30 145 Q32 135, 40 130 L55 125 Q60 123, 62 118 L65 110" 
        stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M65 180 L65 145 Q63 138, 58 133" 
        stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cuff line -->
  <path d="M30 145 Q47 140, 65 145" 
        stroke="#c41e3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Left hand - fingers curled holding ring -->
  <!-- Index finger -->
  <path d="M50 120 Q48 105, 52 92 Q54 85, 58 80 Q62 76, 65 74" 
        stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Middle finger -->  
  <path d="M55 118 Q54 100, 58 88 Q61 80, 66 75 Q70 71, 73 69" 
