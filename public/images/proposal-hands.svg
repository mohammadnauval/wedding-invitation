<svg width="220" height="170" viewBox="0 0 220 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LEFT HAND: coming from upper-left, arm diagonal, square cuff, fingers in OK/pinch holding ring -->
  
  <!-- Arm/forearm lines (diagonal from top-left) -->
  <path d="M5 5 Q20 20, 35 38 Q42 48, 48 55" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M18 2 Q32 18, 45 35 Q52 44, 58 52" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Square cuff/watch -->
  <path d="M42 48 L58 52 L62 68 L46 64 Z" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  
  <!-- Palm area connecting to fingers -->
  <path d="M52 64 Q58 72, 62 78 Q65 82, 68 84" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Thumb (curves down to meet index, forming circle to hold ring) -->
  <path d="M55 68 Q62 75, 70 80 Q78 85, 84 88 Q90 90, 94 88 Q97 85, 96 80" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Index finger (curves to meet thumb, forming pinch/OK) -->
  <path d="M68 84 Q75 88, 82 92 Q88 95, 92 94 Q96 92, 96 88 Q96 84, 93 80" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Middle finger (sticking up-left) -->
  <path d="M65 78 Q68 70, 72 62 Q75 56, 80 50" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Ring finger (sticking up) -->
  <path d="M70 76 Q74 66, 80 58 Q84 52, 88 46" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Pinky (sticking up-right) -->
  <path d="M74 78 Q80 68, 87 60 Q92 54, 96 50" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- THE RING (small oval between thumb and index) -->
  <ellipse cx="90" cy="86" rx="7" ry="8" stroke="#c41e3a" stroke-width="3" fill="none"/>
  
  <!-- Bow/ribbon on ring -->
  <path d="M86 78 Q83 74, 79 72" stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M94 78 Q97 74, 101 72" stroke="#c41e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M86 78 Q90 76, 94 78" stroke="#c41e3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkle lines (short strokes near ring) -->
  <path d="M104 76 L110 72" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 84 L113 82" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M102 68 L107 64" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  
  <!-- RIGHT HAND: coming from lower-right, open palm facing up, fingers together pointing up-left -->
  
  <!-- Forearm lines (from bottom-right going up) -->
  <path d="M195 170 Q190 155, 182 142 Q176 132, 170 125" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M215 165 Q207 150, 198 138 Q192 130, 185 123" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Palm -->
  <path d="M170 125 Q165 118, 160 113 Q155 108, 150 105" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M185 123 Q180 116, 174 110 Q168 105, 163 102" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Fingers (together, slightly spread, pointing up-left) -->
  <!-- Index finger -->
  <path d="M150 105 Q146 97, 143 89 Q141 83, 140 78" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Middle finger -->
  <path d="M154 103 Q151 94, 149 86 Q147 79, 147 74" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Ring finger -->
  <path d="M158 102 Q156 93, 155 85 Q154 78, 154 73" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Pinky -->
  <path d="M163 102 Q162 94, 161 86 Q161 80, 162 75" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Thumb (curving outward to the right-bottom) -->
  <path d="M168 112 Q175 116, 180 120 Q186 124, 190 126 Q194 127, 196 124" stroke="#c41e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
